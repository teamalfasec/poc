<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Link POC - Auto Trigger</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        .status { font-size: 1.2em; color: #333; margin-bottom: 20px; }
        .step { font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

    <h2>Deep Link Auto-Trigger POC</h2>
    <div class="status" id="status-text">Starting in 2 seconds...</div>
    <div id="countdown"></div>

    <script>
        const steps = [
            { name: "SMS App", link: "sms:+1234567890", delay: 2000 },
            { name: "Google Maps", link: "maps://maps.google.com/?q=San+Francisco", delay: 5000 },
            { name: "Mail App", link: "mailto:test@example.com?subject=Test&body=Hello", delay: 5000 },
            { name: "Web Search", link: "x-web-search://?q=test", delay: 5000 }
        ];

        let currentStep = 0;

        function triggerNext() {
            if (currentStep < steps.length) {
                let step = steps[currentStep];
                document.getElementById('status-text').innerHTML = `Opening: <span class="step">${step.name}</span>`;
                
                // Deep link trigger
                window.location.href = step.link;

                currentStep++;
                if (currentStep < steps.length) {
                    setTimeout(triggerNext, steps[currentStep].delay);
                } else {
                    setTimeout(() => {
                        document.getElementById('status-text').innerText = "All triggers completed.";
                    }, 3000);
                }
            }
        }

        // Initial delay to start
        setTimeout(triggerNext, 2000);
    </script>
</body>
</html>
